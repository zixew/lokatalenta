name: Deploy Backend & Frontend

on:
  push:
    branches:
      - dev
      - 'release/**'
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment (dev or main)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - main

jobs:
  backend-check:
    name: Backend Migrations Check (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify migration filenames & non-empty SQL
        run: |
          count=$(ls -1 supabase/migrations/*.sql | wc -l)
          echo "Found $count SQL migration files."
          for f in supabase/migrations/*.sql; do
            test -s "$f" || { echo "Empty migration: $f"; exit 1; }
          done

      - name: Apply Supabase Migrations (Dev) when SUPABASE_DB_URL_DEV secret is set
        if: (github.ref == 'refs/heads/dev' || inputs.target == 'dev') && env.HAS_DB_URL == 'true'
        env:
          HAS_DB_URL: ${{ secrets.SUPABASE_DB_URL_DEV != '' }}
          SUPABASE_DB_URL_DEV: ${{ secrets.SUPABASE_DB_URL_DEV }}
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          for f in supabase/migrations/*.sql; do
            echo "Applying $f to Dev..."
            psql "$SUPABASE_DB_URL_DEV" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Apply Supabase Migrations (Prod) when SUPABASE_DB_URL_PROD secret is set
        if: (github.ref == 'refs/heads/main' || inputs.target == 'main') && env.HAS_DB_URL == 'true'
        env:
          HAS_DB_URL: ${{ secrets.SUPABASE_DB_URL_PROD != '' }}
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          for f in supabase/migrations/*.sql; do
            echo "Applying $f to Prod..."
            psql "$SUPABASE_DB_URL_PROD" -v ON_ERROR_STOP=1 -f "$f"
          done

  frontend-build-verify:
    name: Frontend Build Verification (${{ github.ref_name }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint, Test & Build
        run: |
          npm run lint
          npm test
          npm run build
